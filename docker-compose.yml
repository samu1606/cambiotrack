version: "3.8"

# =============================================================================
# CambioTrack — docker-compose para Dokploy
# Detección de cambios en páginas web. Apache 2.0 License.
# =============================================================================

services:
  changedetection:
    image: dgtlmoon/changedetection.io:latest
    container_name: cambiotrack_app
    restart: always
    volumes:
      - changedetection_data:/datastore
    expose:
      - "5000"

volumes:
  changedetection_data:
